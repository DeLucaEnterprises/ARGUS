<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ARGUS — search map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>html,body,#map{height:100%;margin:0}</style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([36.02, -80.38], 13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    fetch('../data/output/manifest.json')
      .then(r => r.json())
      .then(data => {
        data.photos.forEach(p => {
          if (p.lat === null) return;
          L.marker([p.lat, p.lon]).addTo(map)
            .bindPopup(`<b>${p.filename}</b><br>${p.width}x${p.height}`);
        });
        if (data.photos[0] && data.photos[0].lat !== null) {
          map.setView([data.photos[0].lat, data.photos[0].lon], 16);
        }
      });
  </script>
</body>
</html>
